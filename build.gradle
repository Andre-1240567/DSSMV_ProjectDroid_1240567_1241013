plugins {
    id 'com.android.application' version '8.4.2'
    id 'com.google.gms.google-services' version '4.4.2'
}

def getEnvProperty(String key) {
    def envFile = rootProject.file(".env")
    if (envFile.exists()) {
        def properties = new Properties()
        envFile.withInputStream { properties.load(it) }
        def val = properties.getProperty(key)
        if (val != null) return val
    }
    return System.getenv(key) ?: ""
}

android {
    namespace 'pt.isep.dssmv.projectdroid'
    compileSdk 34

    defaultConfig {
        applicationId "pt.isep.dssmv.projectdroid"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "TMDB_API_KEY", "\"${getEnvProperty('TMDB_API_KEY')}\""
        buildConfigField "String", "FOURSQUARE_API_KEY", "\"${getEnvProperty('FOURSQUARE_API_KEY')}\""
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Firebase Authentication & Cloud Firestore
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Testing
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}